name: Flutter CI/CD

# - Every push and pull request: analyze, test, and build a debug APK.
# - Push to main with a new pubspec version: build a signed AAB, upload it
#   to Google Play as a draft on production and closed testing, then tag it
#   and create the GitHub release.
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # Keep in sync with the Flutter version used locally.
  FLUTTER_VERSION: "3.47.9"
  JAVA_VERSION: "25"
  PACKAGE_NAME: com.jiro.st_lorenzo_ruiz_novena
  # "alpha" is the API name of Play's default closed testing track. If you use a
  # custom closed testing track, put its exact name here instead.
  PLAY_TRACKS: "production alpha"

jobs:
  verify:
    name: Analyze & test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: |
          flutter config --jdk-dir "$JAVA_HOME"
          flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - run: flutter build apk --debug --no-pub --target-platform android-x64

  release:
    name: Build & upload release
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release and tag

    env:
      # Read by android/app/build.gradle for release signing.
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      # Relative to android/app/, where the keystore is decoded below.
      STORE_FILE: keystore.jks
      # Base64 keystore and Play service-account JSON; decoded to files below.
      KEYSTORE: ${{ secrets.KEYSTORE }}
      PLAY_AUTH_JSON: ${{ secrets.PLAY_AUTH_JSON }}
      # Optional: Firebase Android config for push notifications. Not needed
      # if android/app/google-services.json is committed (it is not a secret).
      # Without either, the app is built without push notifications.
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

    steps:
      - uses: actions/checkout@v6

      - name: Read version from pubspec.yaml
        id: version
        run: |
          APP_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//')
          VERSION_NAME=${APP_VERSION%%+*}
          VERSION_CODE=${APP_VERSION#*+}
          if [ -z "$VERSION_NAME" ] || [ "$VERSION_NAME" = "$APP_VERSION" ]; then
            echo "::error::pubspec.yaml version must be name+code, e.g. 2.0.0+11"
            exit 1
          fi
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Skip if this version was already released
        id: released
        run: |
          tag=$(git ls-remote --tags origin "refs/tags/${{ steps.version.outputs.tag }}")
          if [ -n "$tag" ]; then
            echo "Tag ${{ steps.version.outputs.tag }} exists; bump the version in pubspec.yaml to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Every following step is gated on `skip` (a plain `exit 0` would only
      # end the step above, not the job).
      - name: Validate release secrets
        if: steps.released.outputs.skip == 'false'
        run: |
          missing=()
          for name in STORE_PASSWORD KEY_PASSWORD KEY_ALIAS KEYSTORE PLAY_AUTH_JSON; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secret(s): ${missing[*]}"
            exit 1
          fi

      - uses: actions/setup-java@v5
        if: steps.released.outputs.skip == 'false'
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2.23.0
        if: steps.released.outputs.skip == 'false'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Decode signing keystore
        if: steps.released.outputs.skip == 'false'
        run: printf '%s' "$KEYSTORE" | base64 --decode > android/app/keystore.jks

      - name: Add Firebase config (optional)
        if: steps.released.outputs.skip == 'false' && env.GOOGLE_SERVICES_JSON != ''
        run: |
          if [ -f android/app/google-services.json ]; then
            echo "google-services.json is committed; keeping it."
          else
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          fi

      - name: Build signed App Bundle
        if: steps.released.outputs.skip == 'false'
        run: |
          flutter config --jdk-dir "$JAVA_HOME"
          flutter pub get --enforce-lockfile
          flutter build appbundle --release --no-pub \
            --build-name=${{ steps.version.outputs.name }} \
            --build-number=${{ steps.version.outputs.code }}
          mv build/app/outputs/bundle/release/app-release.aab \
             build/app/outputs/bundle/release/app-${{ steps.version.outputs.tag }}.aab

      - name: Upload to Google Play (draft on production + closed testing)
        if: steps.released.outputs.skip == 'false'
        run: |
          printf '%s' "$PLAY_AUTH_JSON" > "$RUNNER_TEMP/play_service_account.json"
          pip install --quiet google-api-python-client google-auth
          python3 scripts/play_upload.py \
            --service-account "$RUNNER_TEMP/play_service_account.json" \
            --package "$PACKAGE_NAME" \
            --aab build/app/outputs/bundle/release/app-${{ steps.version.outputs.tag }}.aab \
            --tracks $PLAY_TRACKS \
            --release-name "${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})"

      - name: Create GitHub release and tag
        if: steps.released.outputs.skip == 'false'
        uses: softprops/action-gh-release@v3.0.4
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Release ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: build/app/outputs/bundle/release/app-${{ steps.version.outputs.tag }}.aab

      - name: Remove signing material
        if: always()
        run: rm -f android/app/keystore.jks "$RUNNER_TEMP/play_service_account.json"
