name: Flutter CI/CD

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  release:
    name: Upload Release
    runs-on: ubuntu-latest

    env:
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEYSTORE: ${{ secrets.KEYSTORE }}
      PLAY_AUTH_JSON: ${{ secrets.PLAY_AUTH_JSON }}
      STORE_FILE: keystore.jks

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version
        id: get_version
        run: |
          APP_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          VERSION_NAME=$(echo "$APP_VERSION" | cut -d '+' -f1)
          VERSION_CODE=$(echo "$APP_VERSION" | cut -d '+' -f2)

          if [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ] || [ "$VERSION_NAME" = "$VERSION_CODE" ]; then
            echo "pubspec.yaml must define version as version_name+version_code, for example 1.0.7+8."
            exit 1
          fi

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Check if tag exists
        id: check_tag
        run: |
          if git ls-remote --tags origin v${{ steps.get_version.outputs.version_name }} | grep v${{ steps.get_version.outputs.version_name }}; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop if already released
        if: steps.check_tag.outputs.exists == 'true'
        run: |
          echo "Version already released. Skipping."
          exit 0

      - name: Validate signing configuration
        run: |
          missing=()

          for name in STORE_PASSWORD KEY_PASSWORD KEY_ALIAS KEYSTORE PLAY_AUTH_JSON; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done

          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing required release signing secret(s): ${missing[*]}"
            exit 1
          fi

      - name: Create tag
        run: |
          git config user.name "jiro.octavo"
          git config user.email "jiro.octavo@gmail.com"
          git tag v${{ steps.get_version.outputs.version_name }}
          git push origin v${{ steps.get_version.outputs.version_name }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Decode keystore
        run: printf '%s' "$KEYSTORE" | base64 --decode > android/app/keystore.jks

      - name: Build AAB
        run: flutter build appbundle --release --build-name=${{ steps.get_version.outputs.version_name }} --build-number=${{ steps.get_version.outputs.version_code }}

      - name: Rename AAB
        run: |
          mv build/app/outputs/bundle/release/app-release.aab \
             build/app/outputs/bundle/release/app-v${{ steps.get_version.outputs.version_name }}.aab

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version_name }}
          name: Release v${{ steps.get_version.outputs.version_name }}
          generate_release_notes: true
          files: build/app/outputs/bundle/release/app-v${{ steps.get_version.outputs.version_name }}.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Google Play authorization
        run: printf '%s' "$PLAY_AUTH_JSON" > android/app/service_account.json

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJson: android/app/service_account.json
          packageName: com.jiro.st_lorenzo_ruiz_novena
          releaseFiles: build/app/outputs/bundle/release/app-v${{ steps.get_version.outputs.version_name }}.aab
          track: production
          status: draft
