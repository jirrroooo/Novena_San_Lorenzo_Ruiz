plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

// Firebase push notifications: add android/app/google-services.json (from the
// Firebase console or `flutterfire configure`) to enable them.
if (file("google-services.json").exists()) {
    apply plugin: "com.google.gms.google-services"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def signingProperty = { String name ->
    def envValue = System.getenv(name)
    if (envValue != null && !envValue.trim().isEmpty()) {
        return envValue.trim()
    }

    def propertyValue = keystoreProperties[name]
    if (propertyValue != null && !propertyValue.toString().trim().isEmpty()) {
        return propertyValue.toString().trim()
    }

    return null
}

def releaseTaskRequested = gradle.startParameter.taskNames.any { taskName ->
    def normalizedTaskName = taskName.toLowerCase(Locale.ROOT)
    normalizedTaskName.contains("release")
}

def resolvedKeyAlias = signingProperty("KEY_ALIAS")
def resolvedKeyPassword = signingProperty("KEY_PASSWORD")
def resolvedStorePassword = signingProperty("STORE_PASSWORD")
def resolvedStoreFile = signingProperty("STORE_FILE")

if (resolvedStoreFile == null && resolvedKeyAlias && resolvedKeyPassword && resolvedStorePassword) {
    resolvedStoreFile = "keystore.jks"
}

if (releaseTaskRequested) {
    def missingSigningProperties = []
    if (!resolvedKeyAlias) missingSigningProperties.add("KEY_ALIAS")
    if (!resolvedKeyPassword) missingSigningProperties.add("KEY_PASSWORD")
    if (!resolvedStorePassword) missingSigningProperties.add("STORE_PASSWORD")
    if (!resolvedStoreFile) missingSigningProperties.add("STORE_FILE or android/app/keystore.jks")

    if (!missingSigningProperties.isEmpty()) {
        throw new GradleException("Release signing is incomplete. Provide ${missingSigningProperties.join(', ')} through CI secrets/environment variables or android/key.properties.")
    }

    def resolvedStoreFileObject = file(resolvedStoreFile)
    if (!resolvedStoreFileObject.exists()) {
        throw new GradleException("Release signing store file was not found at ${resolvedStoreFileObject}. Set STORE_FILE or decode the CI keystore to android/app/keystore.jks.")
    }
}

android {
    namespace = "com.jiro.st_lorenzo_ruiz_novena"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        // Required by flutter_local_notifications for scheduled notifications.
        coreLibraryDesugaringEnabled true
    }

    defaultConfig {
        applicationId = "com.jiro.st_lorenzo_ruiz_novena"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            keyAlias = resolvedKeyAlias
            keyPassword = resolvedKeyPassword
            storeFile = resolvedStoreFile ? file(resolvedStoreFile) : null
            storePassword = resolvedStorePassword
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
    // WindowCompat.enableEdgeToEdge() for the edge-to-edge window setup in MainActivity.
    implementation "androidx.core:core-ktx:1.17.0"
}

flutter {
    source = "../.."
}
