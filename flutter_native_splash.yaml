# Native launch screen (the only splash screen; the app has no Flutter splash).
# Regenerate after editing:  dart run flutter_native_splash:create
# Colours match AppColors in lib/core/theme/app_theme.dart.
flutter_native_splash:
  color: "#E56B6F"
  color_dark: "#2C2728"
  image: assets/splash/splash_logo.png

  # Android 12+ uses the system splash API: a round icon on a solid colour.
  # The image is 960x960 with the artwork inside the central 640px circle.
  android_12:
    color: "#E56B6F"
    color_dark: "#2C2728"
    image: assets/splash/splash_logo_android12.png
    icon_background_color: "#E56B6F"
    icon_background_color_dark: "#2C2728"

# Note: after regenerating, set android:windowLayoutInDisplayCutoutMode to
# "always" in android/app/src/main/res/values*/styles.xml (the generator writes
# the deprecated "shortEdges"; Android 15+ treats it as "always" anyway).
