name: novena_lorenzo
description: An offline novena app to St. Lorenzo Ruiz
publish_to: 'none'
version: 1.0.7+9

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_local_notifications: ^22.3.1
  flutter_timezone: ^5.1.0
  just_audio: ^0.10.6
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  timezone: ^0.11.0
  url_launcher: ^6.3.2
  audio_session: ^0.2.4
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2
  # Code generator only (run `dart run flutter_native_splash:create`).
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/
    - lib/data/
